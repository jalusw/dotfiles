bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

set -g mouse on
set -g base-index 1

# ===================== Monochromatic =====================
# Near-black/navy panels, monochromatic gray accent.
# tmux has no gradients, so the duotone is expressed
# diagonally with quadrant blocks (▘ ▗) around the text.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -g status-style bg=#14141F,fg=#9C9AB0
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Session (left): dark gray corner shard -> primary gray block
set -g status-left "#[fg=#888888,bg=#0A0A12]▘#[fg=#0A0A12,bg=#CCCCCC] #S #[fg=#CCCCCC,bg=#14141F]▌"

# Clock/date (right): primary gray block, light gray day, dark gray corner shard
set -g status-right "#[fg=#0A0A12,bg=#CCCCCC] %H:%M #[fg=#CCCCCC,bg=#14141F]▌#[fg=#E0E0E0,bg=#14141F] %d %b #[fg=#888888,bg=#0A0A12]▗#[fg=#9C9AB0,bg=#14141F]"

# Windows
setw -g window-status-format "#[fg=#9C9AB0,bg=#1E1E2E] #I #W "
setw -g window-status-current-format "#[fg=#0A0A12,bg=#CCCCCC] #I #W #[fg=#CCCCCC,bg=#14141F]▌"
setw -g window-status-style bg=#14141F,fg=#9C9AB0
setw -g window-status-current-style bg=#CCCCCC,fg=#0A0A12
setw -g window-status-activity-style bg=#1E1E2E,fg=#E0E0E0
setw -g window-status-bell-style bg=#F0F0F0,fg=#0A0A12
setw -g window-status-separator ""

# Panes
set -g pane-border-style fg=#2A2A3D,bg=#14141F
set -g pane-active-border-style fg=#CCCCCC,bg=#14141F

# Copy/mode
setw -g mode-keys vi
setw -g mode-style bg=#CCCCCC,fg=#0A0A12
setw -g copy-mode-match-style bg=#E0E0E0,fg=#0A0A12
setw -g copy-mode-current-match-style bg=#888888,fg=#0A0A12

# Messages
set -g message-style bg=#14141F,fg=#E8E6F0
set -g message-command-style bg=#14141F,fg=#E0E0E0

set-option -g renumber-windows on
