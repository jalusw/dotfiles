[color]
  ui = auto
  diff = auto
  status = auto
  branch = auto
  interactive = auto

[delta]
  navigate = true
  line-numbers = true
  hyperlinks = true
  side-by-side = false
  syntax-theme = Monokai Extended
  plus-style = 'syntax "#00FFC2"'
  minus-style = 'syntax "#FF4E85"'
  line-numbers-plus-style = '#00FFC2'
  line-numbers-minus-style = '#FF4E85'
  line-numbers-zero-style = '#2A2A3D'

[delta "decorations"]
  commit-decoration-style = bold yellow box ul
  commit-style = raw
  file-style = omit
  hunk-header-decoration-style = yellow box
  hunk-header-style = file line-number syntax

[interactive]
  diffFilter = delta --color-only

[grep]
  lineNumber = true
  patternType = perl
