[mgr]
  show_hidden = true
  show_symlink = true
  sort_by = "natural"
  sort_dir_first = true
  linemode = "size"

[preview]
  max_width = 800
  max_height = 800
  image_quality = 75
  image_filter = "triangle"

[opener]
  edit = [
    { run = 'nvim %s', block = true },
  ]
  reveal = [
    { run = 'dolphin --select %s', block = true },
  ]
  open = [
    { run = 'xdg-open %s1', block = false },
  ]
  pdf = [
    { run = 'okular %s', block = false },
  ]

[open]
  rules = [
    { url = "*.md",  use = "edit" },
    { url = "*.txt", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml",  use = "edit" },
    { url = "*.lua",  use = "edit" },
    { url = "*.py",   use = "edit" },
    { url = "*.rs",   use = "edit" },
    { url = "*.go",   use = "edit" },
    { url = "*.js",   use = "edit" },
    { url = "*.ts",   use = "edit" },
    { url = "*.css",  use = "edit" },
    { url = "*.html", use = "edit" },
    { url = "*.sh",   use = "edit" },
    { url = "*.zsh",  use = "edit" },
    { url = "*.bash", use = "edit" },
    { url = "*.pdf",  use = "pdf" },
    { url = "*.png",  use = "open" },
    { url = "*.jpg",  use = "open" },
    { url = "*.jpeg", use = "open" },
    { url = "*.gif",  use = "open" },
    { url = "*.svg",  use = "open" },
    { url = "*.webp", use = "open" },
    { url = "*.mp4",  use = "open" },
    { url = "*.mkv",  use = "open" },
    { url = "*.mov",  use = "open" },
    { url = "*.webm", use = "open" },
  ]
