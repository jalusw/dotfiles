# Hypridle — Monochromatic (OLED burn-in safe, keep-alive)
# System stays alive - only DPMS turns pixels off. No suspend/hibernate.
# DPMS off = true OLED pixel off (black), prevents burn-in, saves power.

general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 150
  on-timeout = loginctl lock-session
}

listener {
  timeout = 180
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# Optional: dim then off fallback using unified script (allows 0 and recovers)
# Uses scripts/brightness: .config/hypr/hyprland.conf:202 sets -n0 to allow 0
# listener {
#   timeout = 170
#   on-timeout = brightness set 0
#   on-resume = brightness restore
# }
