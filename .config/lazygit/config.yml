# Lazygit config — Monochromatic
gui:
  theme:
    lightTheme: false
    activeBorderColor:
      - "#CCCCCC"
      - bold
    inactiveBorderColor:
      - "#2A2A3D"
    optionsTextColor:
      - "#9C9AB0"
    selectedLineBgColor:
      - "#1E1E2E"
    cherryPickedCommitBgColor:
      - "#999999"
    cherryPickedCommitFgColor:
      - "#0A0A12"
    unstagedChangesColor:
      - "#F0F0F0"
    defaultFgColor:
      - "#E8E6F0"
    searchingActiveBorderColor:
      - "#888888"
  authorColors:
    "*": "#9C9AB0"
  nerdFontsVersion: "3"
  showFileTree: true
  showBottomLine: false
  showCommandLog: false
  showRandomTip: false
  showListFooter: false
  skipNoStagedFilesWarning: true
  showIcons: true
  startMaximised: false
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  branchLogCmd: "git log --graph --oneline --abbrev-commit --decorate --all"
  overrideGpg: true
  parseEmoji: true
  allBranchesLogCmds:
    - git log --graph --oneline --abbrev-commit --decorate --all
os:
  editPreset: "nvim"
notifications:
  command: "dunstify"
